name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BarberOS.sln

      - name: Build (warnings as errors)
        run: dotnet build BarberOS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BarberOS.sln --configuration Release --no-build --logger "trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  docker:
    name: API image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f src/BarberOS.API/Dockerfile -t barberos-api:ci .

# Frontend job is added when the Angular workspace lands (Phase 1 WS2).
# CD to staging is a separate workflow introduced with the staging VPS (WS6).
